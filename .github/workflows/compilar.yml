name: Compilar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej. 0.2.0). Vacío = solo actualizar «Última versión».'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

# Con versión (por el formulario o por un tag v*) se publica una release
# propia; sin ella, solo se reemplaza «Última versión».
env:
  VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Pruebas
        working-directory: src-tauri
        run: cargo test --lib

      # Graba 5 s de la pantalla del servidor. Sin audio: estos equipos no
      # tienen tarjeta de sonido. Si falla, el resto sigue para obtener el .exe.
      - name: Grabación de prueba
        id: grabacion
        continue-on-error: true
        working-directory: src-tauri
        run: cargo run --release --example grabar -- 5 --sin-audio

      - name: Subir la grabación de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grabacion-prueba-windows
          path: ~/Videos/Personal Screen Recorder/*.mp4
          if-no-files-found: warn

      - name: Fijar la versión
        if: env.VERSION != ''
        shell: bash
        run: node scripts/fijar-version.mjs "$VERSION"

      - name: Compilar la app
        run: pnpm tauri build

      - name: Subir instaladores
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # Aviso sin detener el flujo: los instaladores se publican igual.
      - name: Avisar si la grabación de prueba falló
        if: steps.grabacion.outcome == 'failure'
        run: echo "::warning::La grabación de prueba en Windows falló; revisa el paso 'Grabación de prueba'."

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Pruebas
        working-directory: src-tauri
        run: cargo test --lib

      - name: Fijar la versión
        if: env.VERSION != ''
        run: node scripts/fijar-version.mjs "$VERSION"

      # En GitHub no está el certificado local "PSR Desarrollo": se firma ad-hoc.
      - name: Compilar la app (Intel + Apple Silicon)
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: instalador-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # Sin versión: reemplaza la release "Última versión". Con versión: crea la
  # release vX.Y.Z (y su tag, si no existe) y deja el enlace en el resumen.
  publicar:
    name: Publicar
    needs: [windows, macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: instalador*
          path: instaladores
          merge-multiple: true

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # El artefacto de Windows conserva las subcarpetas nsis/ y msi/.
          mapfile -t archivos < <(find instaladores -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \))
          printf '%s\n' "${archivos[@]}"
          instrucciones="- **Windows:** \`*-setup.exe\` (instalador) o \`*.msi\`. La app no está firmada: si aparece «Windows protegió su PC», pulsa **Más información → Ejecutar de todas formas**.
          - **Mac (Intel y Apple Silicon):** \`*.dmg\`. No está firmada con Apple Developer: la primera vez ábrela con clic derecho → Abrir."

          if [ -z "$VERSION" ]; then
            gh release delete ultima-version --yes --cleanup-tag || true
            gh release create ultima-version "${archivos[@]}" \
              --title "Última versión" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --notes "Compilada automáticamente desde ${GITHUB_SHA::7}.

          $instrucciones"
            url=$(gh release view ultima-version --json url -q .url)
          else
            tag="v${VERSION#v}"
            gh release create "$tag" "${archivos[@]}" \
              --title "$tag" \
              --target "$GITHUB_SHA" \
              --latest \
              --generate-notes \
              --notes "$instrucciones"
            url=$(gh release view "$tag" --json url -q .url)
          fi
          echo "Release publicada: $url" | tee -a "$GITHUB_STEP_SUMMARY"
